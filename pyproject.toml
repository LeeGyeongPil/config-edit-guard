[project]
name = "config-edit-guard"
version = "0.1.1"
description = "Agent skill that edits one config value by its byte span and verifies the edit on a semantic and a text layer."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "pyyaml==6.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/config-edit-guard/scripts"]

[tool.coverage.run]
source = ["skills/config-edit-guard/scripts"]
